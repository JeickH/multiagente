[pytest]
testpaths = tests
python_files = test_*.py
markers =
    costo: hace llamadas facturables (Bedrock, S3 o el sitio público). No corre sin --con-costo.
    lento: tarda segundos, no milisegundos.
# Los DeprecationWarning de Pydantic v2 sobre los `class Config` de los schemas
# tapaban la salida real de la suite. Son deuda conocida, no ruido nuevo.
filterwarnings =
    ignore::DeprecationWarning:pydantic._internal._config
    ignore:Support for class-based `config`:DeprecationWarning
    # `mascotas.peso_kg` es Numeric: SQLite lo pasa por float y avisa en cada
    # query. En Postgres (producción) no ocurre — es ruido del entorno de tests.
    ignore:Dialect sqlite\+pysqlite does \*not\* support Decimal objects natively:Warning
